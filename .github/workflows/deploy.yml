name: deploy

# Deploys main to Cloudflare after CI passed on it, or on demand
# (ADR-0015, README "Deploying"). Configuration lives in the repository, not
# in the committed wrangler.jsonc:
#   secrets   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, in the `production`
#             environment, limited to the main branch (README, "Deploy from
#             GitHub"), so no other branch's workflow can read them
#   variable  GWC_CANONICAL_URL   the cache's public http:// URL
# Until all three are set, the job only says so and succeeds.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy at a time; never cancel a deploy half-way. CI runs can finish
  # out of order, so the job also skips a commit that is no longer main's tip.
  group: deploy
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"
  MISE_VERSION: "2026.9.7"

jobs:
  deploy:
    name: deploy to Cloudflare
    # A green CI run of a push to main, or a manual run on main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      GWC_CANONICAL_URL: ${{ vars.GWC_CANONICAL_URL }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # The secrets reach only this step and the deploy step, not the tool
      # installers in between.
      - name: configured, and still main's tip?
        id: configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$GWC_CANONICAL_URL" ]; then
            echo "::notice::Not deployed: set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets and the GWC_CANONICAL_URL variable (README, Deploy from GitHub)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$tip" != "$SHA" ]; then
            echo "::notice::Not deployed: $SHA is no longer the tip of main ($tip); that commit's own run deploys it."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - if: steps.configured.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI tested, not whatever main is now.
          ref: ${{ env.SHA }}
          persist-credentials: false
      - if: steps.configured.outputs.ok == 'true'
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: rust@1.99.1 node npm:wrangler cargo:worker-build
      - if: steps.configured.outputs.ok == 'true'
        name: migrate, deploy, check as Shareaza
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/deploy.sh
