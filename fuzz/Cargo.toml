# Fuzz targets for gwc-core's parsers (`cargo fuzz`, nightly only). A
# separate workspace, so the stable build never sees libfuzzer-sys. Run with
# `scripts/fuzz.sh`; the corpora under corpus/ are committed.
[package]
name = "gwc-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
gwc-core = { path = "../crates/gwc-core" }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "query"
path = "fuzz_targets/query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handshake"
path = "fuzz_targets/handshake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cache_url"
path = "fuzz_targets/cache_url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ping_reply"
path = "fuzz_targets/ping_reply.rs"
test = false
doc = false
bench = false
