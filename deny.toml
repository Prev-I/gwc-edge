# cargo-deny: licences, advisories, bans and sources. Run: cargo deny check

[graph]
# The Worker only ever builds for wasm; the native target covers gwc-core and tests.
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
# Every RustSec advisory fails the check unless it is listed here with a reason.
ignore = [
  # chrono is unmaintained (an informational advisory: no vulnerability is
  # reported). We do not use chrono; it comes only through the Workers SDK,
  # `worker` 0.8.7, and `worker` 0.9.0 still depends on it (checked
  # 2026-11-18). Remove this entry once `worker` no longer pulls chrono in.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained, no vulnerability reported; only through worker 0.8.7, and worker 0.9.0 still depends on it" },
]

[licenses]
# Permissive licences compatible with shipping this repository under MIT. Only
# licences actually present are listed; add one deliberately when a new
# dependency needs it.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version; that is not a wildcard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
