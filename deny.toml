# cargo-deny: licences, advisories, bans and sources. Run: cargo deny check

[graph]
# The Worker only ever builds for wasm; the native target covers gwc-core and tests.
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
# Every RustSec advisory fails the check unless it is listed here with a reason.
ignore = []

[licenses]
# Permissive licences compatible with shipping this repository under MIT. Only
# licences actually present are listed; add one deliberately when a new
# dependency needs it.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version; that is not a wildcard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
