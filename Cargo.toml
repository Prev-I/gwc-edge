[workspace]
resolver = "3"
members = ["crates/gwc-core", "crates/gwc-worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/Prev-I/rs-gwc-edge"

[workspace.dependencies]
gwc-core = { path = "crates/gwc-core" }
form_urlencoded = "=1.2.2"
worker = { version = "=0.8.7", features = ["d1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
console_error_panic_hook = "=0.1.7"
proptest = "=1.12.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
# Smaller wasm loads faster, and startup time competes with the 10 ms CPU budget.
opt-level = "s"
lto = true
codegen-units = 1
# No `strip`: it removes the custom sections wasm-bindgen reads, and the build
# then fails with "externref table required for catch wrappers".
