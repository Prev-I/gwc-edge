[workspace]
resolver = "3"
members = ["crates/gwc-core", "crates/gwc-testclient", "crates/gwc-worker"]
# Fuzz targets build only with nightly, in their own workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Prev-I/gwc-edge"

[workspace.dependencies]
gwc-core = { path = "crates/gwc-core" }
form_urlencoded = "=1.2.2"
worker = { version = "=0.8.7", features = ["d1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
console_error_panic_hook = "=0.1.7"
# Already in the tree through `worker`: its Socket implements tokio's
# AsyncRead/AsyncWrite, and the cron runs handshakes concurrently.
tokio = { version = "=1.54.1", default-features = false }
futures-util = { version = "=0.3.34", default-features = false, features = ["alloc"] }
proptest = "=1.12.0"
# No TLS, no gzip: Shareaza speaks plain HTTP and sends no Accept-Encoding.
ureq = { version = "=3.5.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
# Smaller wasm loads faster, and startup time competes with the 10 ms CPU budget.
opt-level = "s"
lto = true
codegen-units = 1
# No `strip`: it removes the custom sections wasm-bindgen reads, and the build
# then fails with "externref table required for catch wrappers".
